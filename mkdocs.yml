site_name: '1С: Адаптер Kafka'
site_description: Встраиваемая подсистема 1С:Предприятие для интеграции с Apache Kafka
site_url: https://shadobaai.github.io/kafka-adapter/
repo_url: https://github.com/ShadobaAI/kafka-adapter
repo_name: ShadobaAI/kafka-adapter
docs_dir: docs
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  custom_dir: docs_theme
  language: ru
  font: false
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.tracking
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/portal.css

extra_javascript:
  - assets/javascripts/mermaid-config.js
  - assets/javascripts/portal.js

plugins:
  - search:
      lang:
        - ru
        - en
      separator: '[\s\-\.\_]+'
  - tags
  - awesome-pages
  - glightbox:
      touchNavigation: true
      loop: false
      effect: fade
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
  - git-revision-date-localized:
      locale: ru
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
  - redirects:
      redirect_maps:
        'user/installation/edt-setup.md': 'user/installation/adaptation.md'
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true

markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Постоянная ссылка
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: portal-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.saneheaders
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ShadobaAI/kafka-adapter
      name: GitHub
  generator: false

nav:
  - Главная: index.md
  - Начало работы:
    - start/index.md
    - "Выгрузка: 1С → Kafka": start/outgoing.md
    - "Загрузка: Kafka → 1С": start/incoming.md
  - Обзор:
    - overview/index.md
    - О проекте: overview/about.md
    - Возможности и быстрый старт: overview/capabilities.md
    - Архитектура: overview/architecture.md
    - Потоки данных: overview/data-flow.md
    - Принципы и ограничения: overview/principles.md
  - Руководства:
    - user/index.md
    - Установка и подключение:
      - user/installation/index.md
      - Требования: user/installation/requirements.md
      - Как расширение конфигурации: user/installation/extension.md
      - В основную конфигурацию: user/installation/main-config.md
      - Адаптация подсистемы: user/installation/adaptation.md
      - Роли и права: user/installation/roles.md
      - Обновление версий: user/installation/updating.md
    - Настройка подсистемы:
      - user/configuration/index.md
      - Брокеры: user/configuration/brokers.md
      - "Продюсеры — выгрузка": user/configuration/producers.md
      - "Консьюмеры — загрузка": user/configuration/consumers.md
      - Фоновые и регламентные задания: user/configuration/jobs.md
      - Алерты и контроль: user/configuration/alerts.md
      - Логирование: user/configuration/logging.md
    - Разработка интеграции:
      - user/development/index.md
      - Программный API: user/development/api.md
      - Обработчик продюсера: user/development/producer-handler.md
      - Обработчик консьюмера: user/development/consumer-handler.md
      - Прямой API — справочник: user/development/direct-api.md
      - Конвертация данных 3.1: user/development/conversion-data.md
    - Примеры:
      - user/examples/index.md
      - "Выгрузка: 1С → Kafka":
        - Справочник: user/examples/outgoing-catalog.md
        - Документ с табличной частью: user/examples/outgoing-document.md
        - Строки отдельными сообщениями: user/examples/outgoing-split-rows.md
        - Независимый регистр: user/examples/outgoing-register.md
        - Регистр по регистратору: user/examples/outgoing-recorder.md
        - Подавление регистрации: user/examples/suppress.md
        - Принудительная регистрация: user/examples/force-registration.md
        - Произвольные события: user/examples/custom-events.md
      - "Загрузка: Kafka → 1С":
        - Upsert справочника: user/examples/incoming-catalog.md
        - Регистр сведений: user/examples/incoming-register.md
        - Отмена обработки: user/examples/incoming-cancel.md
      - Общие сценарии:
        - Идемпотентность: user/examples/idempotency.md
        - Защищённое подключение: user/examples/secure-connection.md
        - Прямой API — примеры: user/examples/direct-api.md
    - Эксплуатация:
      - user/operations/index.md
      - Мониторинг очередей: user/operations/monitoring.md
      - Статусы сообщений: user/operations/statuses.md
      - Обслуживание очередей: user/operations/queue-maintenance.md
      - Диагностика: user/operations/diagnostics.md
      - Типовые проблемы: user/operations/troubleshooting.md
      - Производительность: user/operations/performance.md
  - Разработка адаптера:
    - project/index.md
    - Окружение и участие:
      - Участие в разработке: project/contributing.md
      - Окружение: project/environment.md
      - Репозитории: project/repositories.md
    - Устройство подсистемы:
      - Архитектура модулей: project/modules.md
      - Объекты метаданных: project/metadata.md
      - Управляющие константы: project/constants.md
    - Расширение и поставка:
      - Расширение адаптера: project/extending.md
      - Форматы поставки: project/delivery-formats.md
    - Контракт данных AsyncAPI и XDTO:
      - Описание AsyncAPI: project/asyncapi-yaml.md
      - Поддерживаемая модель XDTO в Адаптере Kafka: project/adapter-xdto-requirements.md
      - "XDTO: модель данных обмена": project/xdto.md
      - Требования к YAML для генерации XDTO-модели: project/yaml-requirements-for-xdto.md
      - Генерация XSD из YAML: project/xsd-generation.md
  - Глоссарий: glossary.md
  - FAQ: faq/index.md
