name: Release / Quality

on:
  workflow_call:
    outputs:
      test_report_url:
        description: Published release reports root URL
        value: ${{ jobs.publish_reports.outputs.test_report_url }}
      allure_ui_report_url:
        description: Published Allure UI test report URL
        value: ${{ jobs.publish_reports.outputs.allure_ui_report_url }}
      allure_unit_report_url:
        description: Published Allure unit test report URL
        value: ${{ jobs.publish_reports.outputs.allure_unit_report_url }}
      sonar_report_url:
        description: Published SonarQube static report URL
        value: ${{ jobs.publish_reports.outputs.sonar_report_url }}
      sonar_dashboard_url:
        description: SonarQube dashboard URL
        value: ${{ jobs.sonar.outputs.sonar_dashboard_url }}
    secrets:
      REPORTS_TOKEN:
        required: true
      SONAR_TOKEN:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ASSETS_DIR: assets

jobs:
  prepare:
    name: Prepare test infobase and UI groups
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      ui_groups: ${{ steps.inputs.outputs.ui_groups }}
      edt_version: ${{ steps.inputs.outputs.edt_version }}
      started_at: ${{ steps.inputs.outputs.started_at }}
      yaxunit_version: ${{ steps.inputs.outputs.yaxunit_version }}
      vanessa_version: ${{ steps.inputs.outputs.vanessa_version }}
    env:
      ADAPTER_CF_XML: ${{ github.event.repository.name }}-cf-xml.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CF-XML artifacts
        uses: actions/download-artifact@v4
        with:
          name: cf-xml-artifacts
          path: ${{ env.ASSETS_DIR }}

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Log in to GHCR for Docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read EDT version from image metadata
        run: |
          set -euo pipefail

          image_ref="ghcr.io/shadobaai/edtcli:latest"

          config_json="$(oras manifest fetch-config --platform linux/amd64 "${image_ref}")"
          edt_version="$(jq -r '
            (.config.Labels // .config.labels // .labels // {}) as $labels
            | $labels["ru.shadobaai.onec.edt-version"]
              // $labels["org.opencontainers.image.version"]
              // empty
          ' <<< "${config_json}")"

          if [ -z "${edt_version}" ]; then
            manifest_json="$(oras manifest fetch --platform linux/amd64 "${image_ref}")"
            edt_version="$(jq -r '
              (.annotations // .labels // {}) as $labels
              | $labels["ru.shadobaai.onec.edt-version"]
                // $labels["org.opencontainers.image.version"]
                // empty
            ' <<< "${manifest_json}")"
          fi

          if [ -z "${edt_version}" ]; then
            echo "::error::EDT version was not found in ${image_ref} metadata"
            exit 1
          fi

          echo "EDT_VERSION=${edt_version}" >> "$GITHUB_ENV"
          echo "REPORT_RUN_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Download base and examples release assets
        run: |
          mkdir -p "${ASSETS_DIR}"
          gh release download --repo ShadobaAI/kafka-adapter-base --pattern "kafka-adapter-base-xml.zip" --output "${ASSETS_DIR}/kafka-adapter-base-xml.zip"
          gh release download --repo ShadobaAI/kafka-adapter-examples --pattern "kafka-adapter-examples.cfe" --output "${ASSETS_DIR}/kafka-adapter-examples.cfe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download test DT template
        run: |
          mkdir -p "${ASSETS_DIR}"
          oras pull ghcr.io/shadobaai/kfk-tmpl-test:latest -o "${ASSETS_DIR}"

      - name: Download unit test assets
        run: |
          mkdir -p "${ASSETS_DIR}/unit"
          oras pull ghcr.io/shadobaai/unit:latest -o "${ASSETS_DIR}/unit"
          if [ ! -f "${ASSETS_DIR}/unit/unit.cfe" ] && [ -f "${ASSETS_DIR}/unit/output/unit.cfe" ]; then
            cp "${ASSETS_DIR}/unit/output/unit.cfe" "${ASSETS_DIR}/unit/unit.cfe"
          fi
          curl -fsSL \
            https://raw.githubusercontent.com/ShadobaAI/kafka-adapter-tests-unit/main/YaxParams.json \
            -o "${ASSETS_DIR}/unit/YaxParams.json"

      - name: Download UI test assets
        uses: actions/checkout@v4
        with:
          repository: ShadobaAI/kafka-adapter-tests-ui
          path: ${{ env.ASSETS_DIR }}/ui
          sparse-checkout: |
            /features/**
            /libraries/**
            /VAParams.json
          sparse-checkout-cone-mode: false

      - name: Download Vanessa Automation
        run: |
          mkdir -p "${ASSETS_DIR}/ui"
          echo "VANESSA_AUTOMATION_VERSION=$(gh release view --repo Pr-Mex/vanessa-automation --json tagName --jq .tagName)" >> "$GITHUB_ENV"
          gh release download --repo Pr-Mex/vanessa-automation --pattern "VAExtension*.cfe" --output "${ASSETS_DIR}/ui/VAExtension.cfe"
          gh release download --repo Pr-Mex/vanessa-automation --pattern "vanessa-automation-single.*.zip" --output "${RUNNER_TEMP}/vanessa-automation-single.zip"
          unzip -j "${RUNNER_TEMP}/vanessa-automation-single.zip" "vanessa-automation-single.epf" -d "${ASSETS_DIR}/ui"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download YAxUnit
        run: |
          mkdir -p "${ASSETS_DIR}/unit"
          echo "YAXUNIT_VERSION=$(gh release view --repo bia-technologies/yaxunit --json tagName --jq .tagName)" >> "$GITHUB_ENV"
          gh release download --repo bia-technologies/yaxunit --pattern "YAxUnit-*.cfe" --output "${ASSETS_DIR}/unit/YAXUNIT.cfe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check test inputs
        run: |
          missing=0
          check_file() {
            if [ ! -f "$1" ]; then
              echo "::error::File not found: $1"
              missing=1
            fi
          }
          check_dir() {
            if [ ! -d "$1" ]; then
              echo "::error::Directory not found: $1"
              missing=1
            fi
          }

          check_file "${ASSETS_DIR}/${ADAPTER_CF_XML}"
          check_file "${ASSETS_DIR}/kafka-adapter-base-xml.zip"
          check_file "${ASSETS_DIR}/kafka-adapter-examples.cfe"
          check_file "${ASSETS_DIR}/kfk-tmpl-test.dt"
          check_file "${ASSETS_DIR}/unit/unit.cfe"
          check_file "${ASSETS_DIR}/unit/YaxParams.json"
          check_file "${ASSETS_DIR}/unit/YAXUNIT.cfe"
          check_file "${ASSETS_DIR}/ui/VAParams.json"
          check_dir "${ASSETS_DIR}/ui/features"
          check_dir "${ASSETS_DIR}/ui/libraries"
          check_file "${ASSETS_DIR}/ui/VAExtension.cfe"
          check_file "${ASSETS_DIR}/ui/vanessa-automation-single.epf"

          if [ "$missing" -ne 0 ]; then
            echo "Downloaded assets:"
            find "${ASSETS_DIR}" -maxdepth 3 -mindepth 1 -print | sort
            exit 1
          fi

      - name: Build base XML for tests
        run: |
          python3 .github/scripts/create_test_cf.py \
            --base "${ASSETS_DIR}/kafka-adapter-base-xml.zip" \
            --adapter "${ASSETS_DIR}/${ADAPTER_CF_XML}" \
            --output "${ASSETS_DIR}/base"

      - name: Create test infobase
        run: |
          docker run --rm -v "${{ github.workspace }}/${ASSETS_DIR}:/work" -w /work \
            ghcr.io/shadobaai/ibcmd:latest bash -c "
            vrunner infobase init --src /work/kfk-tmpl-test.dt --ibcmd --ibconnection /F/work/base-db &&
            vrunner cf load --ibcmd --ibconnection /F/work/base-db /work/base &&
            vrunner cfe load --extension-name 'ТестированиеАдаптераKafka' --ibcmd --ibconnection /F/work/base-db /work/kafka-adapter-examples.cfe &&
            vrunner cfe load --extension-name 'YAXUNIT' --ibcmd --ibconnection /F/work/base-db /work/unit/YAXUNIT.cfe &&
            vrunner cfe load --extension-name 'МодульныеТесты' --ibcmd --ibconnection /F/work/base-db /work/unit/unit.cfe &&
            vrunner cfe load --extension-name 'VAExtension' --ibcmd --ibconnection /F/work/base-db /work/ui/VAExtension.cfe
          "
          sudo chown -R "$(id -u):$(id -g)" "${ASSETS_DIR}/base-db"

      - name: Fill test infobase
        run: |
          docker run --rm --init \
            -v "${{ github.workspace }}/${ASSETS_DIR}:/work" \
            -v "${{ github.workspace }}/.github/scripts/fill-test-infobase-docker.sh:/fill-test-infobase-docker.sh:ro" \
            -w /work \
            ghcr.io/shadobaai/client:latest \
            bash /fill-test-infobase-docker.sh
          sudo chown -R "$(id -u):$(id -g)" "${ASSETS_DIR}/base-db"

      - name: Package immutable test inputs
        id: inputs
        run: |
          python3 .github/scripts/list_ui_groups.py "${ASSETS_DIR}/ui/features" >> "$GITHUB_OUTPUT"
          test -s "${ASSETS_DIR}/base-db/1Cv8.1CD"
          mkdir -p "${ASSETS_DIR}/test-inputs"
          mv "${ASSETS_DIR}/base-db/1Cv8.1CD" "${ASSETS_DIR}/test-inputs/"
          cp "${ASSETS_DIR}/unit/YaxParams.json" "${ASSETS_DIR}/test-inputs/"
          (cd "${ASSETS_DIR}/ui" && find libraries -type f -print0 | sort -z | xargs -0 -r sha256sum) \
            > "${ASSETS_DIR}/test-inputs/libraries.sha256"
          tar -cf "${ASSETS_DIR}/test-inputs/ui.tar" -C "${ASSETS_DIR}/ui" \
            VAParams.json vanessa-automation-single.epf features libraries
          {
            echo "edt_version=$EDT_VERSION"
            echo "started_at=$REPORT_RUN_STARTED_AT"
            echo "yaxunit_version=$YAXUNIT_VERSION"
            echo "vanessa_version=$VANESSA_AUTOMATION_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Upload test inputs
        uses: actions/upload-artifact@v4
        with:
          name: release-test-inputs
          path: ${{ env.ASSETS_DIR }}/test-inputs
          if-no-files-found: error
          overwrite: true

  unit:
    name: Unit
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      ui_groups: ${{ needs.prepare.outputs.ui_groups }}
      attempt: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-release-tests
        with:
          suite: unit
          result-id: ${{ github.run_attempt }}-unit

  ui:
    name: UI / ${{ matrix.group }}
    needs: unit
    if: needs.unit.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        group: ${{ fromJSON(needs.unit.outputs.ui_groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-release-tests
        with:
          suite: ui
          group: ${{ matrix.group }}
          result-id: ${{ needs.unit.outputs.attempt }}-ui-${{ strategy.job-index }}

  reports:
    name: Collect release test reports
    needs: [prepare, unit, ui]
    if: always() && needs.unit.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      unit_report_id: ${{ steps.unit_report.outputs.artifact-id }}
      ui_report_id: ${{ steps.ui_report.outputs.artifact-id }}
      coverage_id: ${{ steps.coverage.outputs.artifact-id }}
    env:
      UNIT_DIR: ${{ format('assets/results/test-results-{0}-unit', needs.unit.outputs.attempt) }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_NAME: ${{ github.event.release.name }}
      EDT_VERSION: ${{ needs.prepare.outputs.edt_version }}
      REPORT_RUN_STARTED_AT: ${{ needs.prepare.outputs.started_at }}
      YAXUNIT_VERSION: ${{ needs.prepare.outputs.yaxunit_version }}
      VANESSA_AUTOMATION_VERSION: ${{ needs.prepare.outputs.vanessa_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download results from this Unit run and its UI groups
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-${{ needs.unit.outputs.attempt }}-*
          path: ${{ env.ASSETS_DIR }}/downloads

      - name: Select results from the latest execution of each test job
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${ASSETS_DIR}/results"
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" \
              > "$RUNNER_TEMP/job-pages.json"
            # Reused jobs can get a new ID while keeping their original execution timestamps.
            jq -r '
              [.[].jobs[]] | group_by(.name)[]
              | max_by([.run_attempt, .id]) as $latest
              | if $latest.started_at != null and $latest.completed_at != null then
                  map(select(
                    .started_at == $latest.started_at and
                    .completed_at == $latest.completed_at and
                    .conclusion == $latest.conclusion
                  )) | min_by([.run_attempt, .id])
                else
                  $latest
                end
              | .id
            ' "$RUNNER_TEMP/job-pages.json" > "$RUNNER_TEMP/current-jobs"
          fi
          shopt -s nullglob
          for bundle in "${ASSETS_DIR}"/downloads/test-results-*; do
            if (( GITHUB_RUN_ATTEMPT > 1 )) && ! grep -Fxq -f "$bundle/check-run-id" "$RUNNER_TEMP/current-jobs"; then
              echo "::warning::Skipping superseded test results: ${bundle##*/}"
              continue
            fi
            mv "$bundle" "${ASSETS_DIR}/results/"
          done

      - name: Check coverage artifacts from successful suites
        if: always()
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          UI_RESULT: ${{ needs.ui.result }}
          UI_GROUPS: ${{ needs.unit.outputs.ui_groups }}
          TEST_ATTEMPT: ${{ needs.unit.outputs.attempt }}
        run: |
          expected=()
          if [[ "$UNIT_RESULT" == success ]]; then expected+=("$UNIT_DIR"); fi
          if [[ "$UI_RESULT" == success ]]; then
            count="$(jq length <<< "$UI_GROUPS")"
            for ((i=0; i<count; i++)); do
              expected+=("${ASSETS_DIR}/results/test-results-${TEST_ATTEMPT}-ui-${i}")
            done
          fi
          for dir in "${expected[@]}"; do
            test -s "$dir/coverage/genericCoverage.xml"
          done

      - name: Collect validated coverage XMLs
        if: always()
        run: |
          mkdir -p "${ASSETS_DIR}/coverage"
          if [[ -f "$UNIT_DIR/coverage/genericCoverage.xml" ]]; then
            cp "$UNIT_DIR/coverage/genericCoverage.xml" "${ASSETS_DIR}/coverage/${UNIT_DIR##*/}.xml"
          fi
          shopt -s nullglob
          ui_coverage=("${ASSETS_DIR}"/results/test-results-*-ui-*/coverage/genericCoverage.xml)
          if (( ${#ui_coverage[@]} )); then
            python3 .github/scripts/validate_coverage_report.py "${ui_coverage[@]}"
            for xml in "${ui_coverage[@]}"; do
              job_dir="${xml%/coverage/genericCoverage.xml}"
              cp "$xml" "${ASSETS_DIR}/coverage/${job_dir##*/}.xml"
            done
          fi

      - name: Upload SonarQube coverage inputs
        id: coverage
        if: always() && hashFiles('assets/coverage/*.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sonar-coverage-inputs
          path: ${{ env.ASSETS_DIR }}/coverage
          if-no-files-found: error
          overwrite: true

      - name: Build and upload Allure Unit
        id: unit_report
        if: always()
        uses: ./.github/actions/release-allure-report
        with:
          suite: unit

      - name: Build and upload Allure UI
        id: ui_report
        if: always() && needs.ui.result != 'skipped'
        uses: ./.github/actions/release-allure-report
        with:
          suite: ui
          ui-groups: ${{ needs.unit.outputs.ui_groups }}

      - name: Require Allure artifacts for successful test suites
        if: >-
          always() && (
            (needs.unit.result == 'success' && steps.unit_report.outputs.artifact-id == '') ||
            (needs.ui.result == 'success' && steps.ui_report.outputs.artifact-id == ''))
        run: |
          echo "::error::A successful test suite has no published Allure artifact."
          exit 1

  sonar:
    name: SonarQube
    needs: reports
    if: always() && needs.reports.result != 'skipped'
    uses: ./.github/workflows/release-sonar.yml
    with:
      coverage_id: ${{ needs.reports.outputs.coverage_id }}
    secrets: inherit

  publish_reports:
    name: Publish release reports
    needs: [prepare, reports, sonar]
    if: always() && needs.prepare.result != 'skipped'
    uses: ./.github/workflows/release-publish-reports.yml
    with:
      unit_report_id: ${{ needs.reports.outputs.unit_report_id }}
      ui_report_id: ${{ needs.reports.outputs.ui_report_id }}
      sonar_report_id: ${{ needs.sonar.outputs.sonar_report_id }}
      sonar_dashboard_url: ${{ needs.sonar.outputs.sonar_dashboard_url }}
    secrets: inherit
